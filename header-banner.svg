<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Royal Emerald Base Gradient -->
    <linearGradient id="emeraldBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#011F18" />
      <stop offset="30%" stop-color="#022C22" />
      <stop offset="60%" stop-color="#064E3B" />
      <stop offset="85%" stop-color="#047857" />
      <stop offset="100%" stop-color="#011F18" />
    </linearGradient>

    <!-- Waving Layer 1 Gradient -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.6" />
    </linearGradient>

    <!-- Waving Layer 2 Gradient (Gold Touch) -->
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.3" />
    </linearGradient>

    <!-- Gold Text Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FFD700" flood-opacity="0.45" />
    </filter>

    <!-- Emerald Border Glow Filter -->
    <filter id="emeraldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10B981" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Solid Royal Emerald Background -->
  <rect width="900" height="240" rx="14" fill="url(#emeraldBase)" />

  <!-- Outer Border in Imperial Gold -->
  <rect width="896" height="236" x="2" y="2" rx="12" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.65" />

  <!-- Animated Bottom Wave 1 -->
  <path fill="url(#wave1)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="
        M0,190 C180,225 360,165 540,200 C720,230 840,180 900,195 L900,240 L0,240 Z;
        M0,205 C200,175 380,225 560,180 C740,165 820,215 900,200 L900,240 L0,240 Z;
        M0,180 C160,215 340,190 520,220 C700,185 800,170 900,185 L900,240 L0,240 Z;
        M0,190 C180,225 360,165 540,200 C720,230 840,180 900,195 L900,240 L0,240 Z
      " />
  </path>

  <!-- Animated Bottom Wave 2 (Imperial Gold Wave) -->
  <path fill="url(#wave2)">
    <animate attributeName="d" dur="14s" repeatCount="indefinite"
      values="
        M0,210 C220,180 400,230 600,195 C750,175 830,220 900,210 L900,240 L0,240 Z;
        M0,195 C190,225 370,180 550,215 C710,230 820,185 900,200 L900,240 L0,240 Z;
        M0,210 C220,180 400,230 600,195 C750,175 830,220 900,210 L900,240 L0,240 Z
      " />
  </path>

  <!-- Decorative Corner Jewels (Imperial Gold) -->
  <circle cx="20" cy="20" r="4" fill="#FFD700" opacity="0.8" />
  <circle cx="880" cy="20" r="4" fill="#FFD700" opacity="0.8" />
  <circle cx="20" cy="220" r="4" fill="#FFD700" opacity="0.8" />
  <circle cx="880" cy="220" r="4" fill="#FFD700" opacity="0.8" />

  <!-- Animated Star / Diamond Sparks -->
  <g fill="#FFD700" opacity="0.75">
    <polygon points="120,45 123,53 131,56 123,59 120,67 117,59 109,56 117,53">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
    </polygon>
    <polygon points="780,45 783,53 791,56 783,59 780,67 777,59 769,53 777,53">
      <animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Primary Name: Mahfuz Hasan (High Contrast Imperial Gold) -->
  <text x="50%" y="95" text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" font-size="52" fill="#FFD700" letter-spacing="2" filter="url(#goldGlow)">
    Mahfuz Hasan
  </text>

  <!-- Subtitle: Full-Stack Software Engineer (High Contrast Crisp Mint White) -->
  <text x="50%" y="145" text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-weight="600" font-size="18" fill="#ECFDF5" letter-spacing="2">
    ✨ FULL-STACK SOFTWARE ENGINEER | FRONTEND ARCHITECT | AI BUILDER ✨
  </text>

  <!-- Tag Pill in Royal Gold & Emerald -->
  <g transform="translate(305, 170)">
    <rect width="290" height="28" rx="14" fill="#022C22" stroke="#D4AF37" stroke-width="1.2" opacity="0.9" />
    <text x="145" y="19" text-anchor="middle" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" 
          font-weight="700" font-size="12" fill="#FFD700" letter-spacing="1.5">
      👑 ROYAL EMERALD ARCHITECTURE 👑
    </text>
  </g>
</svg>
